<!-- @dsCard group="Components" viewport="700x430" name="导航与反馈 Feedback" subtitle="Tabs · Segmented · Tooltip · Dialog · Eyebrow · SectionHead" -->
<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); padding: 26px 28px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .ttl { font: var(--t-label); color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel">
const { Tabs, Segmented, Tooltip, Dialog, Eyebrow, SectionHead, Button, IconButton } = window.AsashikiDesignSystem_ddff7e;
const I = (n, s) => <i data-lucide={n} style={{ width: s||15, height: s||15 }}></i>;

function Demo() {
  const [tab, setTab] = React.useState('overview');
  const [view, setView] = React.useState('light');
  const [open, setOpen] = React.useState(false);
  return (
    <div className="stack ad-root">
      <SectionHead title="导航与反馈" jp="Navigation & Feedback" />
      <Eyebrow>Asashiki Design System</Eyebrow>
      <Tabs value={tab} onChange={setTab} items={[
        {key:'overview',label:'总览'},{key:'activity',label:'活动'},{key:'settings',label:'设置'}
      ]} />
      <div className="row">
        <Segmented value={view} onChange={setView} items={[{key:'light',label:'浅色'},{key:'dark',label:'深色'}]} />
        <Tooltip tip="点开模态弹层"><Button variant="secondary" icon={I('layout-panel-top')} onClick={()=>setOpen(true)}>打开 Dialog</Button></Tooltip>
        <Tooltip tip="悬停提示气泡"><IconButton icon={I('info',18)} label="信息" outline /></Tooltip>
      </div>
      <Dialog open={open} onClose={()=>setOpen(false)} title="删除这条时间线？"
        footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>取消</Button><Button variant="danger" onClick={()=>setOpen(false)}>删除</Button></>}>
        此操作不可撤销，设备「android-phone」今日的时间线记录将被永久移除。
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(() => lucide.createIcons(), 60);
</script>
</body>
</html>
