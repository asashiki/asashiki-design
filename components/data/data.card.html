<!-- @dsCard group="Components" viewport="700x430" name="数据展示 Data" subtitle="Card · Badge · Tag · Avatar · Progress · Stat" -->
<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-subtle); color: var(--text); font-family: var(--font); padding: 26px 28px; }
  .wrap { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .ttl { font: var(--t-label); color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; }
  .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .listitem { display: flex; align-items: center; gap: 12px; }
  .listitem .tx b { font: var(--t-body); font-weight: 600; display: block; }
  .listitem .tx small { font: var(--t-caption); color: var(--text-3); }
  .listitem .tm { margin-left: auto; font: var(--t-mono); font-size: 11.5px; color: var(--text-3); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel">
const { Card, Badge, Tag, Avatar, Progress, Stat } = window.AsashikiDesignSystem_ddff7e;
const I = (n, s) => <i data-lucide={n} style={{ width: s||15, height: s||15 }}></i>;

function Demo() {
  return (
    <div className="wrap ad-root">
      <Card raised deco>
        <div className="ad-card__title">device-timeline-mcp</div>
        <div className="ad-card__sub">实时设备时间线 · Android / iOS / macOS</div>
        <div className="inline" style={{margin:'14px 0'}}>
          <Tag variant="accent">mcp</Tag><Tag>timeline</Tag><Tag variant="line">api</Tag>
          <Tag variant="accent" skew>LIVE</Tag>
        </div>
        <Progress label="今日步数目标" valueText="8,432 / 10,000" value={8432} max={10000} />
      </Card>

      <div className="stack">
        <div className="ttl">Badge</div>
        <div className="inline">
          <Badge tone="success" dot>正常</Badge>
          <Badge tone="warning" dot>待审</Badge>
          <Badge tone="danger" dot>离线</Badge>
          <Badge tone="accent" icon={I('sparkles',12)}>New</Badge>
          <Badge tone="outline">v2.0</Badge>
        </div>
        <div className="ttl" style={{marginTop:6}}>List · Avatar</div>
        <div className="listitem"><Avatar icon={I('book-open',18)} /><div className="tx"><b>日记已写入</b><small>diary/2026-06-25.md</small></div><span className="tm">21:47</span></div>
        <div className="listitem"><Avatar name="Ku" size="sm" round /><div className="tx"><b>位置更新 · 嘉兴</b><small>android-phone</small></div><span className="tm">21:30</span></div>
        <div className="ttl" style={{marginTop:6}}>Stat</div>
        <div className="inline" style={{gap:28}}>
          <Stat num={<>8,432</>} label="今日步数" />
          <Stat num={<><em>6</em>h42m</>} label="昨夜睡眠" />
          <Stat num={<><em>+2.4</em>%</>} label="本周" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(() => lucide.createIcons(), 60);
</script>
</body>
</html>
