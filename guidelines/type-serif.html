<!-- @dsCard group="Type" viewport="700x230" name="衬线 Display · Newsreader" subtitle="编辑感衬线 · 只给 hero / 区块标题 / 大引用（克制使用）" -->
<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 26px 28px; }
  .row { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 20px; }
  .row:last-child { border-bottom: none; }
  .tag { font-family: var(--mono); font-size: 11px; color: var(--text-3); width: 138px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="row"><span class="tag">--d-hero · 50/500</span><span style="font:var(--d-hero);letter-spacing:var(--tracking-tight)">浅仪式の朝</span></div>
  <div class="row"><span class="tag">--d-display · 34/500</span><span style="font:var(--d-display)">データは静かに目を覚ます</span></div>
  <div class="row"><span class="tag">--d-title · 23/500</span><span style="font:var(--d-title)">A quiet ritual, every morning</span></div>
  <div class="row"><span class="tag">--d-quote · 24/400i</span><span style="font:var(--d-quote);font-style:italic;color:var(--text-2)">“留白即呼吸。”</span></div>
</body>
</html>
