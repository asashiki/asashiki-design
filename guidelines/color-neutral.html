<!-- @dsCard group="Colors" viewport="700x150" name="中性骨架 Neutral" subtitle="墨白为底 · bg / surface / border 一律中性暖灰，无色相" -->
<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 22px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { width: 96px; }
  .chip { height: 62px; border-radius: var(--radius-m); border: 1px solid var(--border); }
  .nm { font: var(--t-label); margin-top: 8px; }
  .cd { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="nm">bg</div><div class="cd">--bg</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-subtle)"></div><div class="nm">subtle</div><div class="cd">--bg-subtle</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-tint)"></div><div class="nm">tint</div><div class="cd">--bg-tint</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-tint-2)"></div><div class="nm">tint-2</div><div class="cd">--bg-tint-2</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="nm">sunken</div><div class="cd">--surface-sunken</div></div>
    <div class="sw"><div class="chip" style="background:var(--border)"></div><div class="nm">border</div><div class="cd">--border</div></div>
    <div class="sw"><div class="chip" style="background:var(--border-strong)"></div><div class="nm">strong</div><div class="cd">--border-strong</div></div>
  </div>
</body>
</html>
