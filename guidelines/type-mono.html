<!-- @dsCard group="Type" viewport="700x180" name="等宽 Mono + 博客正文" subtitle="数字/ID/时间戳走 mono；长文阅读走衬线 prose" -->
<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 24px 28px; }
  .lab { font: var(--t-label); color: var(--text-2); letter-spacing: .06em; margin-bottom: 8px; }
  .mono { font: var(--t-mono); color: var(--text); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-s); padding: 10px 12px; }
  .prose { font: var(--d-prose); color: var(--text); margin-top: 18px; max-width: 620px; }
</style>
</head>
<body>
  <div class="lab">MONO · --t-mono</div>
  <div class="mono">2026-06-25T09:00:00+08:00 · steps=8,432 · hr=72bpm · id=a9f3c1</div>
  <div class="prose">长文阅读用衬线 <code style="font:var(--t-mono)">--d-prose</code>：19px / 行高 1.78，适合动画观后感这类随笔，一眼松弛、专注内容。</div>
</body>
</html>
