<!-- @dsCard group="Effects" viewport="700x180" name="光照高亮 Glow" subtitle="同源浅樱柔光，非双拼撞色 · 限 hero 笔刷 / 卡片光带，≤ 2 处/屏" -->
<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 24px 28px; }
  .grid { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .hl { font: var(--d-title); }
  .hl em { font-style: normal; background: var(--glow); background-size: 100% 46%; background-position: 0 86%; background-repeat: no-repeat; border-radius: 2px; padding: 0 3px; }
  .card { position: relative; width: 230px; height: 96px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); overflow: hidden; box-shadow: var(--shadow); }
  .card .band { position: absolute; inset: 0 0 auto 0; height: 46px; background: var(--glow-wash); }
  .card .t { position: relative; padding: 16px; }
  .card .t b { font: var(--t-title); }
  .card .t small { font: var(--t-caption); color: var(--text-3); }
  .cap { font: var(--t-caption); color: var(--text-3); margin-top: 8px; }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="hl">白底为主，<em>印象色</em>克制</div><div class="cap">hero 高亮笔刷</div></div>
    <div><div class="card"><div class="band"></div><div class="t"><b>卡片顶部光带</b><br><small>--glow-wash · 一抹光晕</small></div></div></div>
  </div>
</body>
</html>
