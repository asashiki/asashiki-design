<!-- @dsCard group="Brand" viewport="700x210" name="标志组合 Lockup" subtitle="标记 + 字标横向锁定 · 衬线 Asashiki / 中文浅仪式 · 留白 ≥ 标记高度 40%" -->
<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 30px 28px; }
  .lockup { display: inline-flex; align-items: center; gap: 16px; }
  .lockup img { width: 60px; height: 60px; }
  .wm { line-height: 1; }
  .wm .en { font: var(--d-title); font-size: 28px; letter-spacing: .005em; }
  .wm .zh { font: var(--t-small); color: var(--text-2); letter-spacing: .42em; margin-top: 6px; }
  hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
  .small { display: inline-flex; align-items: center; gap: 9px; }
  .small img { width: 30px; height: 30px; }
  .small b { font: var(--d-title); font-size: 17px; }
  .cap { font: var(--t-caption); color: var(--text-3); margin-top: 10px; }
</style>
</head>
<body>
  <div class="lockup">
    <img src="../assets/brand/asashiki-mark-color-t.png" alt="Asashiki">
    <div class="wm"><div class="en">Asashiki</div><div class="zh">浅 仪 式</div></div>
  </div>
  <hr>
  <div class="small"><img src="../assets/brand/asashiki-mark-ink-t.png" alt=""><b>Asashiki</b></div>
  <div class="cap">最小尺寸：标记 ≥ 24px；导航栏锁定用墨线版 + 字标</div>
</body>
</html>
