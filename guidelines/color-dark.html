<!-- @dsCard group="Colors" viewport="700x172" name="深色骨架 Dark" subtitle="中性墨夜 · 印象底色一眼可辨色相，不与黑底混同" -->
<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 22px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { width: 92px; }
  .chip { height: 58px; border-radius: var(--radius-m); border: 1px solid var(--border); }
  .nm { font: var(--t-label); margin-top: 8px; color: var(--text); }
  .cd { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="nm">bg</div><div class="cd">#161318</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="nm">surface</div><div class="cd">--surface</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="nm">raised</div><div class="cd">--surface-raised</div></div>
    <div class="sw"><div class="chip" style="background:var(--border-strong)"></div><div class="nm">border</div><div class="cd">--border-strong</div></div>
    <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="nm">accent</div><div class="cd">#f48fc4</div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><div class="nm">soft</div><div class="cd">--accent-soft</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-tint-2)"></div><div class="nm">tint-2</div><div class="cd">靛蓝 · 可辨</div></div>
  </div>
</body>
</html>
